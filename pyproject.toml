[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causallens"
version = "0.1.0"
description = "Causal investigation and decision intelligence research scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "requests>=2.31,<3"]

[project.optional-dependencies]
experiments = ["econml==0.17.0", "torch==2.15.0"]
eda = ["matplotlib>=3.8,<4"]
dashboard = ["streamlit>=1.40,<2", "matplotlib>=3.8,<4", "seaborn>=0.13,<1", "plotly>=5.18,<8"]
dev = ["pytest>=8,<10", "jupyterlab>=4,<5", "nbconvert>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
