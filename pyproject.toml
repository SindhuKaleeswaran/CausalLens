[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causallens"
version = "0.1.0"
description = "Causal investigation and decision intelligence research scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "requests>=2.31,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
